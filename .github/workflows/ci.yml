name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitnesslab
          POSTGRES_USER: fitnesslab
          POSTGRES_PASSWORD: secret
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create testing database
        env:
          PGPASSWORD: secret
        run: psql -h 127.0.0.1 -p 5435 -U fitnesslab -d fitnesslab -c "CREATE DATABASE fitnesslab_testing OWNER fitnesslab;"

      - name: Dependency audit (composer)
        run: composer audit

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse

      - name: Tests (Pest, with coverage)
        run: vendor/bin/pest --coverage --min=90

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `high` rather than the default `low`: the build should stop for a
      # real vulnerability, not for a transitive advisory in a dev-only
      # toolchain package that has no fix yet. A gate that cries wolf gets
      # switched off, which is worse than a narrower one that doesn't.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Tests (Vitest)
        run: npx vitest run

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Builds the same Dockerfiles production uses, from this checkout —
      # not published GHCR images (a PR hasn't published any yet) and not
      # `php artisan serve`/`npm run dev` (neither is what production
      # actually runs). See docker-compose.e2e.yml for the full reasoning,
      # including a CSP bug this stack itself caught: the frontend image's
      # Content-Security-Policy used to hardcode the production API origin,
      # which silently made the production image unusable against any other
      # origin until it was templated per e2e/docker.
      - name: Build and start the stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - name: Migrate and seed
        run: |
          docker compose -f docker-compose.e2e.yml exec -T backend php artisan migrate --force
          docker compose -f docker-compose.e2e.yml exec -T backend php artisan db:seed --force

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:4173
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # Built per-architecture on native runners rather than one job cross-
  # building both platforms under QEMU emulation — Vite's build (Node/V8
  # under full user-mode emulation) took over 35 minutes and was still
  # running when this was tried for real, instead of the couple of minutes
  # a native build takes. Public repos get free GitHub-hosted arm64
  # runners, so there's no need to emulate at all.
  build-and-push:
    name: Build and push images (${{ matrix.arch }})
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/zaitis/fitnesslab-backend:${{ github.sha }}-${{ matrix.arch }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=https://fitnesslab-api.zaitis.dev/api
          tags: ghcr.io/zaitis/fitnesslab-frontend:${{ github.sha }}-${{ matrix.arch }}

  publish-manifests:
    name: Publish multi-arch manifests
    needs: build-and-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stitches the two single-arch images each matrix leg pushed above
      # into one multi-arch tag — this is what makes `docker pull
      # .../fitnesslab-backend:latest` transparently hand the VPS its
      # arm64 variant and an amd64 dev machine its own, from the same tag.
      - name: Create backend multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/zaitis/fitnesslab-backend:latest \
            -t ghcr.io/zaitis/fitnesslab-backend:${{ github.sha }} \
            ghcr.io/zaitis/fitnesslab-backend:${{ github.sha }}-amd64 \
            ghcr.io/zaitis/fitnesslab-backend:${{ github.sha }}-arm64

      - name: Create frontend multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/zaitis/fitnesslab-frontend:latest \
            -t ghcr.io/zaitis/fitnesslab-frontend:${{ github.sha }} \
            ghcr.io/zaitis/fitnesslab-frontend:${{ github.sha }}-amd64 \
            ghcr.io/zaitis/fitnesslab-frontend:${{ github.sha }}-arm64

  deploy:
    name: Deploy to VPS
    needs: publish-manifests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Pull images and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            git config --global --add safe.directory /var/www/fitnesslab
            cd /var/www/fitnesslab
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm backend php artisan migrate --force
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
