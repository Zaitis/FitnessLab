# FastCGI-to-HTTP sidecar for the E2E stack, mirroring
# deploy/nginx/fitnesslab-api.zaitis.dev.conf — same routing, adapted for
# Docker service-name networking (`backend:9000`) instead of
# `127.0.0.1:9000`, and no TLS/HSTS since this never leaves localhost.
# This exists so E2E genuinely exercises the production topology (nginx +
# php-fpm) rather than `php artisan serve`, which the real deployment never
# runs.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
