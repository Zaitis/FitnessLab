# Laravel API — talks FastCGI directly to the `backend` container
# (docker-compose.prod.yml), which only binds to 127.0.0.1:9000. No web
# server sits in front of PHP-FPM inside that container; this is it.
#
# Every request passes straight through to Laravel's front controller —
# there's no local `root`/`try_files` static-file check, deliberately: the
# host nginx has no access to the container's filesystem, so it can't see
# public/ to serve anything from it directly. Laravel's own router handles
# 404s. Certbot manages the TLS block; run
# `certbot --nginx -d fitnesslab-api.zaitis.dev` once to add it.

server {
    listen 80;
    listen [::]:80;
    server_name fitnesslab-api.zaitis.dev;

    client_max_body_size 10m;

    # HSTS is set on both hostnames because the session cookie is scoped to
    # `.zaitis.dev` (ADR-004) — a downgrade on either host exposes the same
    # cookie. Certbot's --nginx installer adds the TLS block and redirect
    # but does not add HSTS, so it has to be declared here.
    # `includeSubDomains` deliberately omitted: it would bind every other
    # project under zaitis.dev to HTTPS-only, which is not this project's
    # decision to make.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
