# React SPA — proxies to the `frontend` container (docker-compose.prod.yml),
# which only binds to 127.0.0.1:8097 (8080 was already taken by another app
# on this host). Certbot manages the TLS block below; run
# `certbot --nginx -d fitnesslab.zaitis.dev` once to add it.

server {
    listen 80;
    listen [::]:80;
    server_name fitnesslab.zaitis.dev;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
