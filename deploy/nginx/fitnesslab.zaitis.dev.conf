# React SPA — proxies to the `frontend` container (docker-compose.prod.yml),
# which only binds to 127.0.0.1:8097 (8080 was already taken by another app
# on this host). Certbot manages the TLS block below; run
# `certbot --nginx -d fitnesslab.zaitis.dev` once to add it.

server {
    listen 80;
    listen [::]:80;
    server_name fitnesslab.zaitis.dev;

    # HSTS only — the container's own nginx (frontend/docker/nginx.conf)
    # owns CSP and the rest, since it is the layer that knows what the SPA
    # loads. Certbot adds the TLS block but never HSTS. `includeSubDomains`
    # is omitted deliberately; see the API host's config for why.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
